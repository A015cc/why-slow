name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # The race detector needs cgo/gcc. That is dependable on Linux runners;
      # on Windows and macOS it is less predictable, so it is gated to Linux.
      - name: Test (race, Linux)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...

  # The only job that validates the tool's central physical claim against real
  # dropped packets instead of synthetic samples. Every other test of the ladder
  # detector proves the arithmetic and says nothing about reality; this one makes
  # the kernel actually lose 20% of the packets on loopback and asserts the +1s
  # retransmission rung appears.
  #
  # Allowed to fail, deliberately. It depends on a kernel facility, a privileged
  # operation and a statistical outcome — three things that flake. A red run here
  # should prompt a look, not block a merge.
  netem:
    name: netem (real packet loss)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true

      # Reported up front so a skip can be told apart from a pass in the log. If
      # netem is unavailable the test below skips, and a green job that skipped
      # its only real-world assertion is exactly the kind of silence this step
      # exists to break.
      - name: Check netem availability
        run: |
          if sudo -n tc qdisc add dev lo root netem loss 1%; then
            echo "netem is available"
            sudo -n tc qdisc del dev lo root
          else
            echo "::warning::netem unavailable - the integration test will skip"
          fi

      - name: Test the detector against real packet loss
        run: go test -tags integration -count=1 -v -run TestNetemRealLoss ./internal/probe/latency/
